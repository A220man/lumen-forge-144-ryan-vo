services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumen-forge-backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/lumen.db
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
      - OIDC_ISSUER=http://keycloak:8080/realms/lumen-forge
      - OIDC_CLIENT_ID=lumen-forge
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:5173/callback
      - DEMO_MODE=true
    volumes:
      - lumen-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumen-forge-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lumen-forge-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HTTP_PORT=8080
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/realms/master"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  lumen-data: